version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: proxyman_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-proxyman}
      POSTGRES_USER: ${DB_USER:-proxyman}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proxyman_secret}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-proxyman}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: proxyman_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-proxyman_redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: proxyman_bot
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-proxyman}
      - DB_USER=${DB_USER:-proxyman}
      - DB_PASSWORD=${DB_PASSWORD:-proxyman_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-proxyman_redis_secret}
      - USE_POLLING=${USE_POLLING:-true}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - SECRET_KEY=${SECRET_KEY:-proxyman_super_secret}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bot:/app/bot
      - ./config:/app/config
      - ./database:/app/database
      - bot_logs:/app/logs
      - bot_temp:/app/temp

  # REST API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: proxyman_api
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-proxyman}
      - DB_USER=${DB_USER:-proxyman}
      - DB_PASSWORD=${DB_PASSWORD:-proxyman_secret}
      - SECRET_KEY=${SECRET_KEY:-proxyman_super_secret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./config:/app/config
      - ./database:/app/database

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: proxyman_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./webapp:/usr/share/nginx/html
    depends_on:
      - api
      - bot

volumes:
  db_data:
  redis_data:
  bot_logs:
  bot_temp:
